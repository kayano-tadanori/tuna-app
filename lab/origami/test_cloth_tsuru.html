<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>cloth test - tsuru</title>
<style>html,body{margin:0;height:100%;background:#111} canvas{width:100%;height:100%;display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="js/gl.js"></script>
<script src="js/fold.js"></script>
<script src="js/cloth.js"></script>
<script src="js/works/tsuru_precise.js"></script>
<script>
'use strict';
const G = OGL;
const canvas = document.getElementById('c');
canvas.width = 800; canvas.height = 800;
const gl = canvas.getContext('webgl2');

const VS = `#version 300 es
in vec3 aPos; in float aDepth;
uniform mat4 uVP;
out vec3 vColor;
void main(){
  float t = clamp(aDepth / 6.0, 0.0, 1.0);
  vColor = mix(vec3(0.95,0.35,0.35), vec3(0.95,0.85,0.3), t);
  gl_Position = uVP * vec4(aPos,1.0);
}`;
const FS = `#version 300 es
precision highp float;
in vec3 vColor;
out vec4 outColor;
void main(){ outColor = vec4(vColor,1.0); }`;
const prog = G.link(gl, VS, FS);
const locPos = gl.getAttribLocation(prog, 'aPos');
const locDepth = gl.getAttribLocation(prog, 'aDepth');
const locVP = gl.getUniformLocation(prog, 'uVP');

const work = ORIGAMI_WORKS.tsuru_precise;
const state = FOLD.createState(work);
const sim = CLOTH.createSim(work);

// per-vertex "depth" (bone tree depth) just for a color gradient so we can
// visually tell panels apart without needing per-panel random colors.
function boneDepths(mesh) {
  const d = new Array(mesh.boneParent.length).fill(0);
  const order = [];
  const done = new Array(mesh.boneParent.length).fill(false);
  let guard = 0;
  while (order.length < mesh.boneParent.length && guard++ < 100000) {
    for (let i = 0; i < mesh.boneParent.length; i++) {
      if (done[i]) continue;
      const p = mesh.boneParent[i];
      if (p === -1 || done[p]) { done[i] = true; order.push(i); d[i] = p === -1 ? 0 : d[p] + 1; }
    }
  }
  return d;
}
const depths = boneDepths(work.mesh);
const vertDepth = work.mesh.panel.map(p => depths[p]);

const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
const posBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
gl.enableVertexAttribArray(locPos);
gl.vertexAttribPointer(locPos, 3, gl.FLOAT, false, 0, 0);

const depthBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, depthBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertDepth), gl.STATIC_DRAW);
gl.enableVertexAttribArray(locDepth);
gl.vertexAttribPointer(locDepth, 1, gl.FLOAT, false, 0, 0);

const idx = new Uint16Array(work.mesh.tris.flat());
const idxBuf = gl.createBuffer();
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);

// ★どのボーンを「今アクティブ/確定」として完全固定するか。
//   root(4)は常に固定。それ以外はcommittedAngleかliveAngleが非ゼロなら固定。
function boneWeightsFromState() {
  const n = work.mesh.boneParent.length;
  const w = new Array(n).fill(0);
  w[work.root !== undefined ? work.root : 4] = 1;
  for (let i = 0; i < n; i++) {
    if (work.mesh.boneParent[i] === -1) { w[i] = 1; continue; }
    if (state.committedAngle[i] !== 0 || state.liveAngle[i] !== 0) w[i] = 1;
  }
  return w;
}

window._simInfo = { frameCount: 0 };
function frame() {
  const mats = FOLD.currentBoneMatrices(state);
  const bw = boneWeightsFromState();
  CLOTH.applyAttachment(sim, mats, bw);
  CLOTH.step(sim, 1/60, 10);
  window._simInfo.frameCount++;
  window._simInfo.points = sim.points;

  const flatPos = new Float32Array(sim.points.length * 3);
  for (let i = 0; i < sim.points.length; i++) {
    flatPos[i*3] = sim.points[i].x; flatPos[i*3+1] = sim.points[i].y; flatPos[i*3+2] = sim.points[i].z;
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, flatPos, gl.DYNAMIC_DRAW);

  gl.viewport(0,0,canvas.width,canvas.height);
  gl.clearColor(0.07,0.07,0.1,1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.disable(gl.CULL_FACE);

  const view = G.viewMat(0, 3.4, 0.85, window._yaw || 0.7);
  const proj = G.perspective(0.9, 1, 0.05, 20);
  const vp = G.mat4Multiply(proj, view);

  gl.useProgram(prog);
  gl.bindVertexArray(vao);
  gl.uniformMatrix4fv(locVP, false, vp);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
  gl.drawElements(gl.TRIANGLES, idx.length, gl.UNSIGNED_SHORT, 0);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ステップをひとつ確定させる(linkedBoneIds含め、目標角度へ)
window._commitStep = (i) => {
  const step = work.steps[i];
  const boneId = step.handle.boneId;
  state.liveAngle[boneId] = step.targetAngle;
  state.committedAngle[boneId] = step.targetAngle;
  if (step.handle.linkedBoneIds) {
    for (const lb of step.handle.linkedBoneIds) {
      if (typeof lb === 'number') { state.liveAngle[lb] = step.targetAngle; state.committedAngle[lb] = step.targetAngle; }
      else { state.liveAngle[lb.boneId] = lb.target; state.committedAngle[lb.boneId] = lb.target; }
    }
  }
};
window._setYaw = (y) => { window._yaw = y; };
</script>
</body>
</html>
