<text x="600" y="70" font-size="17" font-weight="bold">■ 動く面（左右で6枚・花弁は1枚の剛体）</text>
<text x="600" y="94" font-size="15">桃：花弁 T2R+T2L（Q3-M は平らなまま）</text>
<text x="600" y="116" font-size="15">橙：一番上の層の脇 T1R・T1L</text>
<text x="600" y="138" font-size="15">黄：2枚目の脇 S2R・S2L</text>
<text x="600" y="160" font-size="15">灰：止まる紙（T3・G2・層1・層0）</text>
<text x="600" y="182" font-size="15">赤線＝花弁折りで角が変わる折線（破線は⑦までは平ら）</text>
<text x="600" y="204" font-size="15">灰線＝止まったまま（実線 180°・破線 平ら）</text>
<text x="600" y="226" font-size="15">紫点線＝Q3-M（花弁の中・平らなまま）</text>
<text x="600" y="263" font-size="17" font-weight="bold">■ 「67.5°ずつ」＝P を中心とする4本の軸の間の角</text>
<text x="600" y="287" font-size="15">P-M | 花弁 67.5 | P-Q3 | T1R 67.5 | P-B | S2R 67.5 | P-Q2</text>
<text x="600" y="309" font-size="15">残りの1辺＝止まる紙：G2R 112.5 から、P-O で 180°</text>
<text x="600" y="331" font-size="15">折り返した T3R 45 を引いた 67.5（112.5−45）</text>
<text x="600" y="353" font-size="15">＝辺が 67.5° の球面の菱形（袋折りは 45° の菱形）</text>
<text x="600" y="375" font-size="15">P の周り 45+67.5+67.5+67.5+112.5=360（P&#x27; は鏡映）</text>
<text x="600" y="397" font-size="15">M 90×4・Q3 22.5×4=90（紙の角）・B 90×2=180（紙のふち）</text>
<text x="600" y="434" font-size="17" font-weight="bold">■ 動く仕組み（1自由度）</text>
<text x="600" y="458" font-size="15">θ：花弁が P&#x27;-P まわり（駆動 0→180°）</text>
<text x="600" y="480" font-size="15">φ₁：T1R が花弁の中で P-Q3 まわり ＋φ</text>
<text x="600" y="502" font-size="15">φ₃：S2R が止まる紙の P-Q2 まわり −φ</text>
<text x="600" y="524" font-size="16" font-weight="bold">連動式  tan(φ/2) = cos67.5°·tan(θ/2)</text>
<text x="600" y="547" font-size="15">＝袋折りの式 tan(γ₁/2)tan(γ₂/2)=1/cosα の α=67.5°</text>
<text x="600" y="569" font-size="15">（内角は P-M で θ・P-Q で π−φ）</text>
<text x="600" y="606" font-size="17" font-weight="bold">■ 枝と端点</text>
<text x="600" y="630" font-size="15">0&lt;θ&lt;π：解はちょうど2つ＝花弁折り／脇が折りたたまれた枝</text>
<text x="600" y="652" font-size="15">θ=0：凧形の折り（T1R と S2R が一緒に起きる）と交わる</text>
<text x="600" y="674" font-size="15">θ=π：2つの解が合わさる（どちらも特異点）</text>
</svg>