<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>cloth test</title>
<style>html,body{margin:0;height:100%;background:#111} canvas{width:100%;height:100%;display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="js/gl.js"></script>
<script src="js/fold.js"></script>
<script src="js/cloth.js"></script>
<script src="js/works/_test_cross.js"></script>
<script>
'use strict';
const G = OGL;
const canvas = document.getElementById('c');
canvas.width = 800; canvas.height = 800;
const gl = canvas.getContext('webgl2');

const VS = `#version 300 es
in vec3 aPos; in float aColorId;
uniform mat4 uVP;
out vec3 vColor;
void main(){
  vec3 palette[4];
  palette[0] = vec3(0.9,0.3,0.3); palette[1] = vec3(0.3,0.9,0.3);
  palette[2] = vec3(0.3,0.5,0.95); palette[3] = vec3(0.95,0.9,0.2);
  vColor = palette[int(aColorId)];
  gl_Position = uVP * vec4(aPos,1.0);
}`;
const FS = `#version 300 es
precision highp float;
in vec3 vColor;
out vec4 outColor;
void main(){ outColor = vec4(vColor,1.0); }`;
const prog = G.link(gl, VS, FS);
const locPos = gl.getAttribLocation(prog, 'aPos');
const locColorId = gl.getAttribLocation(prog, 'aColorId');
const locVP = gl.getUniformLocation(prog, 'uVP');

const work = ORIGAMI_WORKS._test_cross;
const state = FOLD.createState(work);
const sim = CLOTH.createSim(work);

// drive: commit step1 fully (angle=pi), leave step2 untouched (angle=0)
// so we can SEE whether the seam between bone1(NW, folded) and bone3(SW, unfolded)
// tears or bends smoothly.
state.liveAngle[1] = Math.PI; state.committedAngle[1] = Math.PI;

const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
const posBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
gl.enableVertexAttribArray(locPos);
gl.vertexAttribPointer(locPos, 3, gl.FLOAT, false, 0, 0);

const colorBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, colorBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(work.mesh.panel), gl.STATIC_DRAW);
gl.enableVertexAttribArray(locColorId);
gl.vertexAttribPointer(locColorId, 1, gl.FLOAT, false, 0, 0);

const idx = new Uint16Array(work.mesh.tris.flat());
const idxBuf = gl.createBuffer();
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);

function boneWeightsFromState() {
  const n = work.mesh.boneParent.length;
  const w = new Array(n).fill(0);
  for (let i = 0; i < n; i++) {
    if (i === 0) { w[i] = 1; continue; } // root always pinned
    w[i] = (state.committedAngle[i] !== 0 || state.liveAngle[i] !== 0) ? 1 : 0;
  }
  return w;
}

let frameCount = 0;
window._simInfo = { frameCount: 0, points: null };

function frame() {
  const mats = FOLD.currentBoneMatrices(state);
  const bw = boneWeightsFromState();
  CLOTH.applyAttachment(sim, mats, bw);
  CLOTH.step(sim, 1/60, 8);
  frameCount++;
  window._simInfo.frameCount = frameCount;
  window._simInfo.points = sim.points.map(p => [p.x, p.y, p.z]);

  const flatPos = new Float32Array(sim.points.length * 3);
  for (let i = 0; i < sim.points.length; i++) {
    flatPos[i*3] = sim.points[i].x; flatPos[i*3+1] = sim.points[i].y; flatPos[i*3+2] = sim.points[i].z;
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, flatPos, gl.DYNAMIC_DRAW);

  gl.viewport(0,0,canvas.width,canvas.height);
  gl.clearColor(0.07,0.07,0.1,1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.CULL_FACE);

  const view = G.viewMat(0, 4, 0.85, 0.7);
  const proj = G.perspective(1.0, 1, 0.1, 20);
  const vp = G.mat4Multiply(proj, view);

  gl.useProgram(prog);
  gl.bindVertexArray(vao);
  gl.uniformMatrix4fv(locVP, false, vp);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
  gl.drawElements(gl.TRIANGLES, idx.length, gl.UNSIGNED_SHORT, 0);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window._startStep2 = () => {
  state.liveAngle[2] = Math.PI; state.committedAngle[2] = Math.PI;
  state.liveAngle[3] = Math.PI; state.committedAngle[3] = Math.PI;
};
// 意地悪テスト：十字折り(bone1=NW谷折りπ)の後、対角(bone3=SW)だけを
// 逆方向(-45°)に「逆折れ」させる。bone2(SE)は0のまま。
// panel3は panel1(NW,π=folded) と panel2(SE,0=flat) の両方と継ぎ目を持つため、
// 「πに向かう力」と「0のまま」の綱引きに加えて、自分自身に-45°の矛盾した
// 目標を与えたときにシステムが破綻(発散・めちゃくちゃな形)しないか確認する。
window._startAdversarial = () => {
  state.liveAngle[3] = -Math.PI / 4; state.committedAngle[3] = -Math.PI / 4;
};
</script>
</body>
</html>
