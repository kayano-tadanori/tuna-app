<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>チッチジャンプ3D</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="hud"></div>
<div id="unitup"></div>
<div id="voyline"></div>

<div id="topbar">
  <button id="btn-back" type="button" title="もどる">‹</button>
  <button id="btn-rank" type="button" title="ランキング">🏆</button>
  <button id="btn-sound" type="button" title="音">🔊</button>
</div>

<div id="items">
  <button class="item" data-item="wing" type="button">🪽</button>
  <button class="item" data-item="rocket" type="button">🚀</button>
</div>

<div id="overlay" class="show">
  <div class="panel">
    <div class="title">チッチジャンプ3D</div>
    <div class="sub" id="ov-sub">タワーをぐるぐる登って、宇宙へ。</div>
    <div class="weather" id="ov-weather"></div>
    <div class="score" id="ov-score"></div>
    <button id="ov-go" type="button">はじめる</button>
    <div class="hint">画面を指でなぞると、チッチがそこへ来ます</div>
  </div>
</div>

<div id="err"></div>

<script src="js/gl.js"></script>
<script src="js/shaders.js"></script>
<script src="js/chicchi.js"></script>
<script src="js/props.js"></script>
<script src="js/scenery.js"></script>
<script src="js/audio.js"></script>
<script src="js/core.js"></script>
<script src="js/renderer.js"></script>
<script src="js/game.js"></script>
</body>
</html>
