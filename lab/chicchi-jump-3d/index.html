<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>チッチジャンプ3D</title>
<link rel="stylesheet" href="style.css?v=20260822d">
</head>
<body>
<canvas id="c"></canvas>

<div id="hud"></div>

<!-- 通ってきた天体の帯（唯一の常設UI。プラン §3.7）。
     下から順に、通った場所が灯っていく。 -->
<div id="strip"><div id="strip-me"></div></div>
<div id="unitup"></div>
<!-- ✨ ジャストジャンプが決まった合図。中身は game.js が入れる。 -->
<div id="just"><b></b><i></i></div>
<div id="voyline"></div>
<div id="letter"></div>
<!-- 👻 自己ベストのゴースト（プラン §3.7）。前のいちばん良かった回の
     「そのときの高さ」が線になって並走する。抜くと金色に光る。
     ★2匹目のチッチ（§5.6）と見わけがつかなくなるので、鳥にはしない。 -->
<div id="ghost"><span>きのうの チッチ</span></div>
<!-- 🚩 標（しるべ）。自分のいちばん遠く（白）と、ほかの子の旗（水色）。
     ★画面に映る高さに来たときだけ出す。遠い旗は、そこへ行くまで見えない
       （プラン §3.9「絶望的な差を正面から見せない」）。 -->
<div id="flags"></div>
<div id="nav"><b>›</b></div>
<div id="skylab"><span id="lab-earth">地球</span><span id="lab-moon">月</span></div>

<div id="topbar">
  <button id="btn-back" type="button" title="もどる">‹</button>
  <button id="btn-rank" type="button" title="ランキング">🏆</button>
  <button id="btn-sound" type="button" title="音">🔊</button>
</div>

<!-- 道具。<b> は のこりの数（本体の localStorage['items'] が出どころ）。
     はじめは 0＝押せない状態にしておく。数が届いたら開く。 -->
<div id="items">
  <button class="item" data-item="wing" type="button" disabled>🪽<b>0</b></button>
  <button class="item" data-item="rocket" type="button" disabled>🚀<b>0</b></button>
</div>

<div id="overlay" class="show title">
  <!-- キーアート（本人が描いたもの）。タイトルの主役はこの1枚。 -->
  <div id="title-art"></div>
  <!-- タイトル（ジェイドパニック／おとんテトリス2 と同じ格）。
       うしろでは公園の3Dがそのまま動いていて、チッチがバネの上で待っている。 -->
  <div class="logo-wrap">
    <div class="logo-sub">OTON GAKUEN presents</div>
    <h1 class="logo">チッチ<span>ジャンプ</span><em>3D</em></h1>
    <div class="logo-line"></div>
    <div class="logo-tag">CYLINDER TOWER ／ ENDLESS DEEP SPACE</div>
    <p class="title-story">ラジオから、ボイジャー1号（ごう）の声。<b>その声は、23時間まえの声。</b></p>
    <p id="ov-best" class="title-best"></p>
  </div>

  <!-- 結果・到着のときだけ出る -->
  <div class="panel" id="ov-panel">
    <div class="sub" id="ov-sub"></div>
    <div class="score" id="ov-score"></div>
  </div>

  <div class="weather" id="ov-weather"></div>
  <button id="ov-go" type="button">はじめる</button>
  <button id="ov-more" type="button" hidden>もっと先へ 🚀</button>
  <div class="starts" id="ov-starts"></div>
  <div class="title-menu">
    <button id="tg-help" type="button" class="tg2">🎮 あそびかた</button>
    <button id="tg-stamp" type="button" class="tg2">🏅 スタンプ帳<i id="tg-stamp-n"></i></button>
  </div>
  <div class="title-toggles">
    <button id="tg-fx" type="button" class="tg on">✨ えんしゅつ</button>
  </div>
  <div class="hint" id="ov-hint">画面を指でなぞる／← → で うごく</div>
</div>

<!-- 📖 あそびかた／スタンプ帳。
     ★中身は game.js が作る（スタンプは その子の記録で毎回ちがう）。 -->
<div id="sheet">
  <div class="sheet-box">
    <div class="sheet-head">
      <div class="sheet-title"><b id="sheet-title"></b><i id="sheet-sub"></i></div>
      <button id="sheet-close" type="button" class="sheet-x" title="とじる">✕</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div id="err"></div>

<script src="js/gl.js?v=20260822d"></script>
<script src="js/shaders.js?v=20260822d"></script>
<script src="js/chicchi.js?v=20260822d"></script>
<script src="js/props.js?v=20260822d"></script>
<script src="js/scenery.js?v=20260822d"></script>
<script src="js/park.js?v=20260822d"></script>
<script src="js/audio.js?v=20260822d"></script>
<script src="js/biome.js?v=20260822d"></script>
<script src="js/core.js?v=20260822d"></script>
<script src="js/renderer.js?v=20260822d"></script>
<script src="js/game.js?v=20260822d"></script>
</body>
</html>
