<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ゲームカード確認</title>
<link rel="stylesheet" href="../style.css">
<style>
  body { background:#080b1a; padding:18px; }
  .wrap { max-width: 420px; margin: 0 auto; display:flex; flex-direction:column; gap:12px; }
  h1 { color:#e8ecf8; font-size:0.95rem; font-family:system-ui; margin:0 0 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ゲーム選択カード（チッチジャンプ2のバナー確認）</h1>

  <button class="subject-card subject-card-game subject-card-tetris" data-subject="tetris">
    <span class="game-icon">🧱</span>
    <span class="game-text">
      <span class="subject-name">オトンテトリス</span>
      <span class="subject-detail">ブロックをつんで消していこう！</span>
    </span>
    <span class="game-arrow">›</span>
  </button>

  <button class="subject-card subject-card-game subject-card-mine" data-subject="mine">
    <span class="game-icon">🪳</span>
    <span class="game-text">
      <span class="subject-name">おかんスイーパー</span>
      <span class="subject-detail">ゴキブリをよけて ぜんぶ開けよう！</span>
    </span>
    <span class="game-arrow">›</span>
  </button>

  <button class="subject-card subject-card-game subject-card-jump" data-subject="jump">
    <span class="game-icon">🐣</span>
    <span class="game-text">
      <span class="subject-name">チッチジャンプ2</span>
      <span class="subject-detail">月をこえて火星まで！どこまで高くいけるか</span>
    </span>
    <span class="game-arrow">›</span>
  </button>

  <button class="subject-card subject-card-game subject-card-gacha" data-subject="gacha">
    <span class="game-icon">🎰</span>
    <span class="game-text">
      <span class="subject-name">ガチャ図鑑</span>
      <span class="subject-detail">コインでキャラをあつめよう！</span>
    </span>
    <span class="game-arrow">›</span>
  </button>
</div>
</body>
</html>
